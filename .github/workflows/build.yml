name: Build ImmortalWrt 25.12 x86_64 Safe
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REPO_BRANCH: openwrt-25.12
  CONFIG_FILE: x86_64_25.12_full_safe.config
  TARGET: x86
  SUBTARGET: 64
  PROFILE: generic
  BUILD_CORES: 2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf git curl wget python3 python3-pip unzip rsync zstd

      - name: Cache download source
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ env.REPO_BRANCH }}
          restore-keys: |
            openwrt-dl-${{ env.REPO_BRANCH }}

      - name: Clone ImmortalWrt source
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git --depth 1 -b ${{ env.REPO_BRANCH }} openwrt

      - name: Add third-party single packages
        run: |
          # 微信推送：单包仓库，直接放入 package 目录（不能用 src-git）
          git clone --depth 1 https://github.com/tty228/luci-app-wechatpush.git openwrt/package/luci-app-wechatpush

      - name: Update and install official feeds
        run: |
          cd openwrt
          set -o pipefail
          echo "==== feeds update -a ====" 2>&1 | tee ../feeds_log.txt
          ./scripts/feeds update -a 2>&1 | tee -a ../feeds_log.txt
          echo "==== feeds install -a ====" 2>&1 | tee -a ../feeds_log.txt
          ./scripts/feeds install -a 2>&1 | tee -a ../feeds_log.txt

      - name: Import config
        run: |
          cp ${{ env.CONFIG_FILE }} openwrt/.config
          cd openwrt
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          make defconfig
          echo "===== config diff ====="
          diff ../${{ env.CONFIG_FILE }} .config > config_diff.txt || true
          cat config_diff.txt

      - name: Download source code
        run: |
          cd openwrt
          make download -j${{ env.BUILD_CORES }}

      - name: Build toolchain (parallel)
        run: |
          cd openwrt
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          set -o pipefail
          make tools/install toolchain/install -j${{ env.BUILD_CORES }} 2>&1 | tee ../toolchain_log.txt

      - name: Patch libffi 3.4.7 (fficonfig.h path fix)
        run: |
          cd openwrt
          python3 - <<'PYEOF'
          p = "feeds/packages/libs/libffi/Makefile"
          s = open(p).read()
          bad = "\t$(CP) \\\n\t\t$(PKG_BUILD_DIR)/$(GNU_TARGET_NAME)*/fficonfig.h \\\n\t\t$(1)/usr/include/\n"
          assert s.count(bad) == 1, "libffi fficonfig.h cp block not found exactly once"
          open(p, "w").write(s.replace(bad, ""))
          print("libffi fficonfig.h path patch applied (matches upstream master)")
          PYEOF
          echo "==== patched Build/InstallDev ===="
          sed -n '/define Build\/InstallDev/,/^endef/p' feeds/packages/libs/libffi/Makefile

      - name: Pre-build libffi serially (verify fix)
        run: |
          cd openwrt
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          set -o pipefail
          # 串行单独编译 libffi（host+target），提前验证补丁是否生效；V=s 保留完整日志
          sed -i 's/^PKG_BUILD_PARALLEL:=1/PKG_BUILD_PARALLEL:=0/' feeds/packages/libs/libffi/Makefile
          make package/libffi/compile -j1 V=s 2>&1 | tee ../libffi.log

      - name: Compile firmware
        run: |
          cd openwrt
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          set -o pipefail
          make -j${{ env.BUILD_CORES }} 2>&1 | tee ../build_log.txt

      - name: Generate SHA256 Checksum
        run: |
          cd openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}
          sha256sum *.img.gz > sha256sums.txt
          cat sha256sums.txt

      - name: Save all error logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: All-Build-Error-Logs
          path: |
            feeds_log.txt
            toolchain_log.txt
            libffi.log
            build_log.txt
            openwrt/config_diff.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-x86_64-Safe-Firmware
          path: |
            openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.img.gz
            openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/sha256sums.txt
          retention-days: 7
